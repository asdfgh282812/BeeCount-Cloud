name: release

# push 到 main 分支:自动 build + push :latest 到 GHCR(免测试,快速,给自己的
# NAS/服务器 docker compose pull 用)。
# feat/v4-dev 分支:手动 Run workflow,更新 :4.0.0-dev(不覆盖 :latest)。
# 打 tag(如 1.6.3):额外跑一次后端/前端测试 + 生成 GitHub Release,再 build
# 该版本号的镜像(同时覆盖 :latest)。
#
# 镜像推到 GHCR(ghcr.io/<owner>/<repo>,全小写),用 workflow 内建的
# GITHUB_TOKEN 登入,不需要另外申请/设定任何 secrets。第一次 push 后记得到
# repo 的 Packages 页面把 package 设成 Public,这样部署端 pull 不用登入。
#
# 4.0 改名(帳好嗎 / TallyCheck,B6 定案):同一份 image 同时推两个名字——
#   - ghcr.io/<owner>/beecount-cloud   (原本的名字,继续推,既有部署不用改)
#   - ghcr.io/<owner>/tallycheck-cloud (新别名,内容完全相同,4.x 中期再正式迁移)
# tallycheck-cloud 第一次推上去后,一样要到 Packages 页面设成 Public。

on:
  push:
    branches: [main]
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ALIAS_IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/tallycheck-cloud" >> "$GITHUB_ENV"

      - name: Setup Python
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend deps
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          SECRET_KEY: test-secret
        run: pytest tests/ -x -q

      - name: Setup Node
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        if: startsWith(github.ref, 'refs/tags/')
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install frontend deps
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Typecheck web
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend/apps/web
        run: npx tsc -b

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/feat/v4-dev" ]]; then
            version="4.0.0-dev-$(git rev-parse --short HEAD)"
          else
            version="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # setup-buildx 要從 Docker Hub 拉 moby/buildkit,GitHub runner 偶爾會 timeout
      # (context deadline exceeded,跟程式碼無關)。失敗就等一下再試一次,兩次都失敗才算失敗。
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        run: sleep 20

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 同一组 tag 套用到两个 image 名称(原名 + tallycheck-cloud 别名)
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.ALIAS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=4.0.0-dev,enable=${{ github.ref == 'refs/heads/feat/v4-dev' }}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=TallyCheck Cloud
            org.opencontainers.image.description=帳好嗎 Cloud / TallyCheck Cloud — self-hosted sync server + web console, based on BeeCount Cloud
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          generate_release_notes: true

      - name: Send Telegram notification (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG="${{ steps.vars.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          PREV_TAG=$(git tag --list --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s")
          fi

          COMMITS_ESCAPED=$(echo "$COMMITS" | sed 's/\*/\\*/g; s/_/\\_/g; s/\[/\\[/g; s/\]/\\]/g; s/`/\\`/g')
          COMMITS_ENCODED=$(echo "$COMMITS_ESCAPED" | sed 's/$/%0A/g' | tr -d '\n')

          MESSAGE="🌱 *TallyCheck Cloud (帳好嗎 Cloud) ${TAG}* 发布%0A%0A"
          MESSAGE="${MESSAGE}🔗 [查看完整说明](${RELEASE_URL})%0A%0A"
          MESSAGE="${MESSAGE}*变更内容*:%0A${COMMITS_ENCODED}"

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true"
            echo "✅ Telegram notification sent successfully!"
          else
            echo "⚠️  Telegram credentials not configured, skipping notification"
          fi
